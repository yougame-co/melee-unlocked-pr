name: Latest (automatic Windows build of main)

# On every push to main: build the Windows Source Port, compatibility build and launcher from the pushed commit, lay them
# over the newest published release zip (tools/ci/overlay-release.py) and publish it as a prerelease tagged
# latest-<short sha>. The previous latest-* prereleases and their tags are then deleted, so there is one at a time.
# A new release each time (never an edited one): anything that follows the release list sees each build as new.
# Never marked as the repository's latest release; the launcher's update check skips it (its tag is not a version).
# Uses only GITHUB_TOKEN.

on:
  push:
    branches: [test/codesign-ci]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codesign-ci
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      BASE_REPO: hero88go/melee-unlocked
      # WinLibs GCC 15.2.0 / MinGW-w64 13.0.0 / UCRT r3 x86_64 POSIX SEH .7z (URL in tools/ci/build-windows.ps1)
      WINLIBS_SHA256: eb61f4fa4ac0945e336e8d70c63b5f596e10ee490375d823559b03635c38d500
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout (no submodules, no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 1

      - name: Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Newest published release (the base) and its SHA-256
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$BASE_REPO/releases?per_page=50" > "$RUNNER_TEMP/releases.json"
          python -I - "$RUNNER_TEMP/releases.json" >> "$GITHUB_ENV" <<'EOF'
          import json, re, sys
          best = None
          for r in json.load(open(sys.argv[1], encoding="utf-8")):
              tag = r.get("tag_name", "")
              if r.get("draft") or r.get("prerelease") or not re.fullmatch(r"v[0-9]+(\.[0-9]+){1,3}", tag):
                  continue
              ver = tag[1:]
              asset = next((a for a in r.get("assets", []) if a.get("name") == f"MeleeUnlocked-{ver}-win64.zip"), None)
              digest = (asset or {}).get("digest") or ""
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                  continue
              if best is None or r["published_at"] > best[0]:
                  best = (r["published_at"], ver, digest[7:])
          if best is None:
              sys.exit("no published release with a MeleeUnlocked-<version>-win64.zip and a SHA-256 digest")
          print(f"BASE_VERSION={best[1]}")
          print(f"BASE_ZIP_SHA256={best[2]}")
          EOF
          tail -n 2 "$GITHUB_ENV"

      - name: Validate
        run: ./tools/ci/build-windows.ps1 -Step validate

      - name: Decomp submodule and base release zip
        run: ./tools/ci/build-windows.ps1 -Step inputs

      - name: Cache pinned WinLibs archive (verified again on every use)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/winlibs-download/winlibs.7z
          key: winlibs-x64-gcc15.2.0-ucrt13-r3-${{ env.WINLIBS_SHA256 }}

      - name: WinLibs GCC and Visual Studio
        run: ./tools/ci/build-windows.ps1 -Step toolchain

      - name: Build melee_game.dll and its SSE2 build (MinGW)
        run: ./tools/ci/build-windows.ps1 -Step dll

      - name: Build melee_source.exe, its SSE2 build and the launcher (MSVC, Source only)
        run: ./tools/ci/build-windows.ps1 -Step host

      - name: Audit and lay the build over the base release
        run: ./tools/ci/build-windows.ps1 -Step package

      - name: Verify the zip
        id: checks
        run: ./tools/ci/build-windows.ps1 -Step checks

      - name: Publish test prerelease test-codesign-<short sha> (test only; deletes nothing)
        shell: bash
        run: |
          set -euo pipefail
          tag="test-codesign-${GITHUB_SHA:0:7}"
          zip="$RUNNER_TEMP/mu-ci/out/MeleeUnlocked-latest-win64.zip"
          gh release create "$tag" "$zip" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "Test only: launcher sign-in by code" --notes "Test build, not a release."
